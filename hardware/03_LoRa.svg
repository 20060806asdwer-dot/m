<line x1="40" y1="648" x2="1150" y2="648" stroke="#ccd5df" stroke-width="0.8"/>
<text x="44" y="664" fill="#9a5715" font-size="10" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="700">节点与接收端之间仅通过无线通信；GND_NODE与GND_RX不是要求用导线跨接的同一网络。</text>
<text x="44" y="684" fill="#243448" font-size="10" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="400">R4/R5在上电、MCU尚未配置时将模式脚拉高；固件运行后由PB0/PB1控制。实际模式表按对应版本手册。</text>
<text x="44" y="704" fill="#243448" font-size="10" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="400">C8/C10为无线近端储能去耦的调试起点，不代替超级电容；容量、ESR、稳压器稳定性和发射最低电压需实测。</text>
<text x="44" y="724" fill="#243448" font-size="10" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="400">wireless_ack配置配合monitor.py --ack；普通wireless/fixed/adaptive不等待远端确认。双方参数须匹配。</text>
<text x="44" y="744" fill="#243448" font-size="10" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="400">电脑端TXD用于回传ACK；只接RXD能够收数但无法确认。先接好匹配天线，再上电测试。</text>
</svg>