<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 1190 842">
<title>01  主板、供电与调试接口</title>
<rect width="100%" height="100%" fill="white"/>
<rect x="20" y="20" width="1150" height="802" stroke="#ccd5df" fill="none" stroke-width="0.9"/>
<text x="40" y="48" fill="#243448" font-size="19" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="700">01  主板、供电与调试接口</text>
<text x="40" y="72" fill="#5b6878" font-size="10" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="400">使用成品Blue Pill最小系统板；同名网络跨页直接相连。方框内是模块，脚名按实物丝印核对。</text>
<line x1="40" y1="87" x2="1150" y2="87" stroke="#ccd5df" stroke-width="0.8"/>
<text x="40" y="789" fill="#5b6878" font-size="9" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="400">RailNode / STM32F103C8T6 Blue Pill / R0.1 / 2026-10-21</text>
<text x="1150" y="789" fill="#5b6878" font-size="9" text-anchor="end" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="400">01 / 04   A3 横向</text>
<text x="40" y="811" fill="#9a5715" font-size="9" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="400">原理图草案：逻辑引脚连接已与代码核对；未做EDA/ERC、PCB布线、实物与功耗验证。</text>
