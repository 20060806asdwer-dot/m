<rect x="55" y="145" width="300" height="155" stroke="#ccd5df" fill="none" stroke-width="0.9"/>
<text x="67" y="168" fill="#243448" font-size="11" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="700">主板已含的部分</text>
<text x="67" y="190" fill="#5b6878" font-size="9" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="400">板载稳压、去耦、复位、启动跳帽与LED。</text>
<text x="67" y="208" fill="#5b6878" font-size="9" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="400">现代码使用内部8MHz HSI与LSI，</text>
<text x="67" y="226" fill="#5b6878" font-size="9" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="400">不依赖外部8MHz / 32.768kHz晶振。</text>
<text x="67" y="244" fill="#5b6878" font-size="9" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="400">各家蓝板电路不同，收到后核对实物。</text>
<rect x="835" y="123" width="300" height="175" stroke="#ccd5df" fill="none" stroke-width="0.9"/>
<text x="847" y="146" fill="#243448" font-size="11" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="700">J1  ST-Link / SWD逻辑接口</text>
<text x="847" y="168" fill="#5b6878" font-size="9" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="400">SWDIO  → SWDIO / PA13</text>
<text x="847" y="186" fill="#5b6878" font-size="9" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="400">SWCLK  → SWCLK / PA14</text>
<text x="847" y="204" fill="#5b6878" font-size="9" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="400">GND       → GND_NODE</text>
<text x="847" y="222" fill="#5b6878" font-size="9" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="400">NRST     → NRST（可选）</text>
<text x="847" y="240" fill="#5b6878" font-size="9" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="400">VTref     → 3V3_NODE（仅电平参考）</text>
<rect x="835" y="340" width="300" height="150" stroke="#ccd5df" fill="none" stroke-width="0.9"/>
<text x="847" y="363" fill="#243448" font-size="11" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="700">J2  USB-TTL调试接口</text>
<text x="847" y="385" fill="#5b6878" font-size="9" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="400">适配器RXD ← DBG_TX / PA2</text>
<text x="847" y="403" fill="#5b6878" font-size="9" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="400">适配器TXD → DBG_RX / PA3（可选）</text>
<text x="847" y="421" fill="#5b6878" font-size="9" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="400">适配器GND ↔ GND_NODE</text>
<text x="847" y="439" fill="#5b6878" font-size="9" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="400">适配器VCC / 5V / 3V3供电脚不接</text>
<text x="847" y="457" fill="#5b6878" font-size="9" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="400">9600 / 8N1；先只接RXD与GND</text>
<line x1="40" y1="625" x2="1150" y2="625" stroke="#ccd5df" stroke-width="0.8"/>
<text x="44" y="641" fill="#9a5715" font-size="10" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="700">接线规则：信号名以接收器件为准，RADIO_RX是无线模块的RXD，因此接MCU的PA9/TX。</text>
<text x="44" y="661" fill="#243448" font-size="10" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="400">本页为成品主板的接口原理图，未把板内裸芯片、晶振和稳压器重复画成可生产电路。</text>
<text x="44" y="681" fill="#243448" font-size="10" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="400">只使用一条明确的节点供电路径；SWD的VTref不是额外电源，按实际调试器说明连接。</text>
<text x="44" y="701" fill="#243448" font-size="10" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="400">自供电验收需拔掉节点USB、ST-Link与调试串口；接收端电脑可以保持独立供电。</text>
<text x="44" y="721" fill="#243448" font-size="10" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="400">C5/C6靠近主板供电排针；高峰值无线去耦位于第03页。所有元件值仍需实测复核。</text>
</svg>