<text x="1090" y="270" fill="#197447" font-size="9" text-anchor="end" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="400">3V3_NODE</text>
<text x="925" y="350" fill="#9a5715" font-size="10" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="400">只选一路，禁止同时并接</text>
<rect x="805" y="385" width="330" height="91" stroke="#ccd5df" fill="none" stroke-width="0.9"/>
<text x="817" y="408" fill="#243448" font-size="11" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="700">J6  外部3.3V调试电源</text>
<text x="817" y="430" fill="#5b6878" font-size="9" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="400">正极 → EXT3V3；负极 → GND_NODE</text>
<text x="817" y="448" fill="#5b6878" font-size="9" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="400">输出设3.3V并限流；SW1选择EXT位置。</text>
<text x="45" y="514" fill="#9a5715" font-size="11" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="700">以下为取电前端设计边界：虚线框内未定型，不属于可照图焊接的电路。</text>
<rect x="45" y="538" width="205" height="83" stroke="#9a5715" fill="none" stroke-width="0.9" stroke-dasharray="5 4"/>
<text x="55" y="560" fill="#9a5715" font-size="11" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="700">磁芯与次级绕组</text>
<text x="55" y="581" fill="#5b6878" font-size="9" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="400">材料/窗口/气隙/匝数</text>
<text x="55" y="598" fill="#5b6878" font-size="9" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="400">50Hz带载功率曲线</text>
<rect x="285" y="538" width="245" height="83" stroke="#9a5715" fill="none" stroke-width="0.9" stroke-dasharray="5 4"/>
<text x="295" y="560" fill="#9a5715" font-size="11" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="700">永久保护、整流与泄放</text>
<text x="295" y="581" fill="#5b6878" font-size="9" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="400">TVS最大钳位/持续耗散</text>
<text x="295" y="598" fill="#5b6878" font-size="9" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="400">二极管额定/损耗/负载</text>
<rect x="565" y="538" width="245" height="83" stroke="#9a5715" fill="none" stroke-width="0.9" stroke-dasharray="5 4"/>
<text x="575" y="560" fill="#9a5715" font-size="11" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="700">降压与限流充电</text>
<text x="575" y="581" fill="#5b6878" font-size="9" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="400">LMR36503具体后缀待核</text>
<text x="575" y="598" fill="#5b6878" font-size="9" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="400">电感/UVLO/反馈/启动</text>
<rect x="845" y="538" width="290" height="83" stroke="#9a5715" fill="none" stroke-width="0.9" stroke-dasharray="5 4"/>
<text x="855" y="560" fill="#9a5715" font-size="11" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="700">超级电容与欠压路径</text>
<text x="855" y="581" fill="#5b6878" font-size="9" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="400">容量/ESR/漏电/充电限压</text>
<text x="855" y="598" fill="#5b6878" font-size="9" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="400">防倒灌/硬件欠压/ADC隔离</text>
<line x1="40" y1="648" x2="1150" y2="648" stroke="#ccd5df" stroke-width="0.8"/>
<text x="44" y="664" fill="#9a5715" font-size="10" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="700">LP5907的有效输入/输出电容各需至少1uF；图中2.2uF仍须按直流偏压、温度和容差核查有效容量。</text>
<text x="44" y="684" fill="#243448" font-size="10" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="400">LP5907额定250mA不代表本板已经满足无线峰值；先测掉压、稳压稳定性和温升，必要时另设计无线支路。</text>
<text x="44" y="704" fill="#243448" font-size="10" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="400">本版没有完成取能、整流限压、超级电容充电和硬件欠压电路；固件保护与预算不能替代这些电路。</text>
<text x="44" y="724" fill="#243448" font-size="10" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="400">原作品的TVS标称电压不能直接当成最大钳位电压；LMR36503工作/瞬态限值要按完整后缀和厂家手册核算。</text>
<text x="44" y="744" fill="#243448" font-size="10" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="400">下一版需先确定磁芯带载曲线、前端峰值、充电目标与实际负载，再画完整电源元件级原理图。</text>
</svg>