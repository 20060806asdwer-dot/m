<rect x="55" y="330" width="255" height="145" stroke="#ccd5df" fill="none" stroke-width="0.9"/>
<text x="67" y="353" fill="#243448" font-size="11" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="700">J3  低压储能/调试输入</text>
<text x="67" y="375" fill="#5b6878" font-size="9" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="400">正极 → VSTORE；负极 → GND_NODE</text>
<text x="67" y="393" fill="#5b6878" font-size="9" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="400">初期用限流直流源模拟，名义4.0V。</text>
<text x="67" y="411" fill="#5b6878" font-size="9" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="400">不接线圈、未保护整流或市电。</text>
<text x="67" y="429" fill="#5b6878" font-size="9" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="400">LP5907推荐输入上限5.5V，</text>
<text x="67" y="447" fill="#5b6878" font-size="9" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="400">前端设计必须留过冲与误差裕量。</text>
<text x="886" y="162" fill="#243448" font-size="12" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="700">SW1  单刀双掷 / 先断后合</text>
<text x="813" y="226" fill="#197447" font-size="9" text-anchor="end" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="400">EXT3V3</text>
<line x1="815" y1="235" x2="875" y2="235" stroke="#197447" stroke-width="1.2"/>
<circle cx="875" cy="235" r="3" stroke="#197447" fill="white"/>
<text x="813" y="306" fill="#197447" font-size="9" text-anchor="end" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="400">REG3V3</text>
<line x1="815" y1="315" x2="875" y2="315" stroke="#197447" stroke-width="1.2"/>
<circle cx="875" cy="315" r="3" stroke="#197447" fill="white"/>
