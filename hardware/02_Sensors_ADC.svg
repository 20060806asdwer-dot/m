<text x="825" y="535" fill="#243448" font-size="9" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="400">VSTORE=ADC÷4095×VDDA×2</text>
<text x="825" y="557" fill="#9a5715" font-size="9" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="400">VSTORE暂定0至5.5V；不是过压保护。</text>
<text x="825" y="579" fill="#243448" font-size="9" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="400">4.0V时分压支路约20uA / 80uW。</text>
<line x1="40" y1="625" x2="1150" y2="625" stroke="#ccd5df" stroke-width="0.8"/>
<text x="44" y="641" fill="#9a5715" font-size="10" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="700">ADXL345模块必须确认内部供电和I/O确实适合3.3V；不能把模块的VIN与芯片VDD_IO混为一谈。</text>
<text x="44" y="661" fill="#243448" font-size="10" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="400">若裸用ADXL345芯片，需要另按厂家电源去耦、封装与布局设计；本图为模块接口。INT1/INT2本版轮询读取，不接。</text>
<text x="44" y="681" fill="#243448" font-size="10" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="400">ADC输入必须在允许范围内；不接线圈或未限压整流输出。先让节点供电，再接低压VSTORE，断电顺序反过来。</text>
<text x="44" y="701" fill="#243448" font-size="10" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="400">JP1用于断开独立VSTORE测量源，避免节点断电时从PA0倒灌；未来自动欠压断电方案还要增加采样隔离设计。</text>
<text x="44" y="721" fill="#243448" font-size="10" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="400">R6/R7各100k使分压倍率为2；更换阻值后同步修改app_config.h并用万用表校准。</text>
</svg>